<!doctype html><meta charset="utf-8"><link rel="icon" href="data:, "><title>Space Taxi animation playtest</title>
<style>body{margin:0;background:#17202b;color:white;font:16px system-ui}header{position:absolute;top:0;padding:16px;background:#17202be8;z-index:1}button,select{font:inherit;padding:8px;margin:4px}#status{font-size:13px}canvas{display:block}</style>
<header><strong>Space Taxi • animation playtest</strong><br><select id="asset" aria-label="Model and animation"></select><button id="pause">Pause</button><button id="front">Front</button><button id="side">Side</button><button id="back">Back</button><div id="status">Loading…</div></header>
<script type="importmap">{"imports":{"three":"./deps/package/build/three.module.js","three/addons/":"./deps/package/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#263343');scene.add(new T.HemisphereLight(0xe8f3ff,0x6c7279,2.4));for(const [x,y,z,p] of [[3,5,5,3],[-4,3,-2,2]]){const l=new T.DirectionalLight(0xffffff,p);l.position.set(x,y,z);scene.add(l);}
const grid=new T.GridHelper(10,40,0x75899d,0x43556a);scene.add(grid);const camera=new T.PerspectiveCamera(34,innerWidth/innerHeight,.01,200);const controls=new OrbitControls(camera,renderer.domElement);
const catalog=await(await fetch('../optimized-delivery/catalog.json')).json();const assets=catalog.flatMap(a=>a.models.map(m=>({...m,id:a.id,key:a.id+'-'+m.kind})));const select=document.querySelector('#asset');assets.forEach(a=>select.add(new Option(a.key,a.key)));
let model,mixer,clip,paused=false,baseBox,height=2,current,ready=false;const loader=new GLTFLoader();const cache=new Map();
function view(v='front'){const c=baseBox.getCenter(new T.Vector3());controls.target.copy(c);const dir=v==='side'?new T.Vector3(1,0,0):v==='back'?new T.Vector3(0,0,-1):new T.Vector3(0,0,1);camera.position.copy(c).addScaledVector(dir,height*2.4);camera.position.y+=height*.12;controls.update();renderer.render(scene,camera);}
window.loadAsset=async key=>{ready=false;if(model){scene.remove(model);mixer?.stopAllAction();mixer?.uncacheRoot(model);}current=assets.find(a=>a.key===key);select.value=key;let gltf=cache.get(key);if(!gltf){gltf=await loader.loadAsync(current.path.replace('/media/pirate/EXTERNAL/Space Taxi',''));cache.set(key,gltf);}model=gltf.scene;scene.add(model);model.position.set(0,0,0);mixer=new T.AnimationMixer(model);clip=gltf.animations[0];if(clip)mixer.clipAction(clip).play();mixer.setTime(0);model.updateMatrixWorld(true);baseBox=new T.Box3().setFromObject(model,true);height=baseBox.max.y-baseBox.min.y;grid.position.y=baseBox.min.y;view();document.querySelector('#status').textContent=`${current.id} • ${current.kind} • ${current.triangles.toLocaleString()} triangles • ${clip?clip.duration.toFixed(2)+'s loop':'static'}`;ready=true;window.ready=true;return {duration:clip?.duration||0,height,skins:current.bones};};
window.sample=(phase,v='front')=>{paused=true;mixer.setTime((clip?.duration||0)*phase);model.updateMatrixWorld(true);view(v);const box=new T.Box3().setFromObject(model,true);return {min:box.min.toArray(),max:box.max.toArray(),time:mixer.time};};
window.audit=()=>{let invalid=0,minY=Infinity,maxHeight=0,maxWidth=0;const positions=[];for(let i=0;i<120;i++){mixer.setTime((clip?.duration||0)*i/60);model.updateMatrixWorld(true);const b=new T.Box3().setFromObject(model,true);const values=[...b.min.toArray(),...b.max.toArray()];if(values.some(x=>!Number.isFinite(x)))invalid++;minY=Math.min(minY,b.min.y);maxHeight=Math.max(maxHeight,b.max.y-b.min.y);maxWidth=Math.max(maxWidth,b.max.x-b.min.x);const bones=[];model.traverse(o=>{if(o.isBone)bones.push(o.getWorldPosition(new T.Vector3()).toArray());});positions.push(bones);}return {invalid,minY,maxHeight,maxWidth,baseHeight:height,animated:JSON.stringify(positions[0])!==JSON.stringify(positions[30]),duration:clip?.duration,render:renderer.info.render};};
window.play=()=>{paused=false;};select.onchange=()=>window.loadAsset(select.value);document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Play':'Pause';};for(const v of ['front','side','back'])document.querySelector('#'+v).onclick=()=>view(v);
let last=performance.now();renderer.setAnimationLoop(now=>{const dt=Math.min((now-last)/1000,.05);last=now;if(ready&&!paused)mixer.update(dt);controls.update();renderer.render(scene,camera);});addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
await window.loadAsset('passenger-nova-botanist-walking');
</script>
